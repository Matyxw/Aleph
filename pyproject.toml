[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "el-aleph-sovereign"
version = "33.0.0"
description = "El Aleph v33.0.0 Sovereign Omega Self-Improving Kernel, Bitacora Vault & .aleph World Designer V7"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.12.0",
    "hypothesis>=6.100.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
aleph = "aleph_cli:main"

[tool.setuptools.packages.find]
include = ["aleph", "aleph.*", "aleph_core", "aleph_core.*"]

[tool.pytest.ini_options]
testpaths = ["aleph_core/tests", ".aleph/tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    "error::SyntaxWarning",
]
