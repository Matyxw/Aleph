[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "el-aleph-sovereign"
version = "33.0.0"
description = "El Aleph v33.0.0 Sovereign Omega Self-Improving Kernel, Bitácora Vault & Formal Verification Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary-Sovereign" }
authors = [
  { name = "El Aleph Architecture Council" }
]
dependencies = [
  "pydantic>=1.10.0",
]

[project.optional-dependencies]
smt = ["z3-solver>=4.12.0"]
dev = ["pytest>=8.0.0", "selenium>=4.10.0"]

[project.scripts]
aleph = "aleph_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aleph_core*", "aleph*", "ab_eval*"]

[tool.pytest.ini_options]
testpaths = ["aleph_core/tests", ".aleph/tests"]
python_files = ["test_*.py"]
