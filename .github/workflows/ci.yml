name: El Aleph v33.0.0 Sovereign CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify bytecode compilation with zero SyntaxWarnings
        run: python -W error::SyntaxWarning -m compileall -q aleph_core .aleph

      - name: Verify Bitacora Merkle Vault & Cleanliness
        run: |
          python aleph_cli.py bitacora-status
          python .aleph/scripts/scan_cleanliness.py .

      - name: Run aleph_core formal test suite
        run: python aleph_cli.py test

      - name: Run .aleph subsystem test suite
        run: python -m pytest .aleph/tests -v --tb=short

      - name: Verify Git Release Gate
        run: python aleph_cli.py git-gate .
